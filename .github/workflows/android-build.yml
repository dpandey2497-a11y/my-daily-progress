name: Build My Daily Progress APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        mkdir -p extracted
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d extracted/
        else
          cp -r ./* extracted/ 2>/dev/null || true
        fi

        # Find folder having gradlew or build.gradle
        GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        else
          PROJECT_DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Build Debug APK
      run: |
        cd "$PROJECT_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyDailyProgress-APK
        path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
