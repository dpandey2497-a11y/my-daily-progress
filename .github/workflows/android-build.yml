name: Build My Daily Progress APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Unzip Project
      run: |
        mkdir -p extracted
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d extracted/
        else
          cp -r ./* extracted/ 2>/dev/null || true
        fi

        PROJECT_DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo
