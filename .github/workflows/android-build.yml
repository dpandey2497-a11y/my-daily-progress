name: Build My Daily Progress APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          GRADLE_FILE=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Daily-Progress-APK
          path: "**/build/outputs/apk/debug/*.apk"
